name: ConvergenceTerminal Automated Pipeline

on:
  push:
    branches:
      - master
  schedule:
    # Runs 3 times a day (06:00, 14:00, 22:00 UTC)
    - cron: '0 6,14,22 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ingest-and-synthesize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Two-Stage Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
        run: |
          python3 internal/scripts/ingest.py

      - name: Commit & Publish Updated Feed
        run: |
          git config --global user.name "ConvergenceTerminal Bot"
          git config --global user.email "bot@convergenceterminal.internal"
          git add public/data.json internal/db/terminal.db internal/data/archive/
          git commit -m "chore(feed): automated intelligence update [skip ci]" || echo "No changes to commit"
          git push
